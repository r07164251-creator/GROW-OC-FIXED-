name: Android debug build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate Gradle project (folder with settings.gradle[.kts])
        id: loc
        run: |
          settings=$(find . -maxdepth 3 \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)
          if [ -z "$settings" ]; then echo "settings.gradle(.kts) not found"; exit 1; fi
          dir=$(dirname "$settings")
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "Project directory: $dir"
          ls -la "$dir"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Make sure Gradle Wrapper is complete
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ] || [ ! -f gradlew ]; then
            echo "Wrapper incomplete: generating it with the official Gradle 8.9"
            tmp=$(mktemp -d)
            (cd "$tmp" && gradle wrapper --gradle-version 8.9)
            mkdir -p gradle/wrapper
            cp "$tmp/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/gradle-wrapper.jar
            [ -f gradlew ] || cp "$tmp/gradlew" gradlew
            [ -f gradlew.bat ] || cp "$tmp/gradlew.bat" gradlew.bat
          fi
          chmod +x gradlew

      - name: Build debug APK
        working-directory: ${{ steps.loc.outputs.dir }}
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Grow-OC-debug-apk
          path: ${{ steps.loc.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
